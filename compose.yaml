name: trackflow-local
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trackflow_inventory}
      POSTGRES_USER: ${POSTGRES_USER:-trackflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trackflow_local_only}
    ports: ["55432:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Qdrant vector store for the RAG knowledge base (Engagement 7).
  qdrant:
    image: qdrant/qdrant:v1.12.4
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    ports: ["6333:6333"]
    volumes:
      - qdrant-storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  identity:
    build: {context: ., dockerfile: docker/identity.Dockerfile}
    environment:
      IDENTITY_DB_PATH: /app/services/identity/data/identity.json
      IDENTITY_JWT_PRIVATE_KEY: ${IDENTITY_JWT_PRIVATE_KEY}
      IDENTITY_JWT_PUBLIC_KEY: ${IDENTITY_JWT_PUBLIC_KEY}
      AUTH_COOKIE_SECURE: "false"
      FRONTEND_BASE_URL: http://localhost:3000
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_SENDER: ${EMAIL_SENDER:-no-reply@trackflow.example}
      OAUTH_ISSUER_URL: http://localhost:8002
      OAUTH_DYNAMIC_REGISTRATION_ENABLED: ${OAUTH_DYNAMIC_REGISTRATION_ENABLED:-true}
    volumes: [identity-data:/app/services/identity/data]
    ports: ["8002:8000"]

  migrate:
    build: {context: ., dockerfile: docker/central-api.Dockerfile}
    profiles: ["setup"]
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-trackflow}:${POSTGRES_PASSWORD:-trackflow_local_only}@postgres:5432/${POSTGRES_DB:-trackflow_inventory}
      MIGRATION_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-trackflow}:${POSTGRES_PASSWORD:-trackflow_local_only}@postgres:5432/${POSTGRES_DB:-trackflow_inventory}
      IDENTITY_JWT_PUBLIC_KEY: ${IDENTITY_JWT_PUBLIC_KEY}
    depends_on:
      postgres: {condition: service_healthy}
    # This image bakes a HEALTHCHECK against :8000, which this command never binds.
    healthcheck: {disable: true}
    command: [".venv/bin/alembic", "upgrade", "head"]

  seed:
    build: {context: ., dockerfile: docker/central-api.Dockerfile}
    profiles: ["setup"]
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-trackflow}:${POSTGRES_PASSWORD:-trackflow_local_only}@postgres:5432/${POSTGRES_DB:-trackflow_inventory}
      IDENTITY_JWT_PUBLIC_KEY: ${IDENTITY_JWT_PUBLIC_KEY}
      SEED_USER_UUID: ${SEED_USER_UUID:-}
    depends_on:
      postgres: {condition: service_healthy}
    # This image bakes a HEALTHCHECK against :8000, which this command never binds.
    healthcheck: {disable: true}
    command: ["/bin/sh", "-c", ".venv/bin/seed-inventory && .venv/bin/seed-suppliers"]

  central-api:
    build: {context: ., dockerfile: docker/central-api.Dockerfile}
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-trackflow}:${POSTGRES_PASSWORD:-trackflow_local_only}@postgres:5432/${POSTGRES_DB:-trackflow_inventory}
      CENTRAL_API_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      IDENTITY_JWT_PUBLIC_KEY: ${IDENTITY_JWT_PUBLIC_KEY}
      IDENTITY_OAUTH_ISSUER_URL: http://localhost:8002
      IDENTITY_OAUTH_INTERNAL_URL: http://identity:8000
      CENTRAL_API_OAUTH_RESOURCE_URL: http://localhost:8003
      AGENT_MCP_URL: http://mcp:8000/mcp
      AGENT_MCP_RESOURCE_URL: http://localhost:8004/mcp
      AGENT_MCP_OAUTH_CLIENT_ID: ${CENTRAL_API_MCP_OAUTH_CLIENT_ID:-}
      AGENT_MCP_OAUTH_CLIENT_SECRET: ${CENTRAL_API_MCP_OAUTH_CLIENT_SECRET:-}
      REPORTING_ROLLUP_CUTOVER_ENABLED: ${REPORTING_ROLLUP_CUTOVER_ENABLED:-false}
      REPORTING_COMPUTATION_ENABLED: ${REPORTING_COMPUTATION_ENABLED:-true}
      REPORTING_FORCE_STALE: ${REPORTING_FORCE_STALE:-false}
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["8003:8000"]

  mcp:
    build: {context: ., dockerfile: docker/mcp.Dockerfile}
    environment:
      APP_ENVIRONMENT: local
      IDENTITY_OAUTH_ISSUER_URL: http://localhost:8002
      IDENTITY_OAUTH_INTERNAL_URL: http://identity:8000
      IDENTITY_JWT_PUBLIC_KEY: ${IDENTITY_JWT_PUBLIC_KEY}
      OAUTH_CLIENT_ID: ${MCP_CENTRAL_API_OAUTH_CLIENT_ID:-}
      OAUTH_CLIENT_SECRET: ${MCP_CENTRAL_API_OAUTH_CLIENT_SECRET:-}
      MCP_RESOURCE_URL: http://localhost:8004/mcp
      CENTRAL_API_URL: http://central-api:8000
      CENTRAL_API_OAUTH_RESOURCE_URL: http://localhost:8003
    depends_on:
      identity: {condition: service_healthy}
      central-api: {condition: service_healthy}
    ports: ["8004:8000"]

  backoffice:
    build: {context: ., dockerfile: docker/backoffice.Dockerfile}
    environment:
      IDENTITY_API_URL: http://identity:8000
      CENTRAL_API_URL: http://central-api:8000
      TALENT_API_URL: ${TALENT_API_URL:-https://playground.4geeks.com/tracker/api/v1}
      AUTH_COOKIE_SECURE: "false"
    depends_on:
      identity: {condition: service_healthy}
      central-api: {condition: service_healthy}
    ports: ["3000:3000"]

  # Live operations feed — synthetic-but-canonical warehouse activity generator.
  # Off unless OPERATIONS_FEED_ENABLED=true; single-writer via a pg advisory lock.
  operations-feed:
    build: {context: ., dockerfile: docker/central-api.Dockerfile}
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-trackflow}:${POSTGRES_PASSWORD:-trackflow_local_only}@postgres:5432/${POSTGRES_DB:-trackflow_inventory}
      OPERATIONS_FEED_ENABLED: ${OPERATIONS_FEED_ENABLED:-false}
      OPERATIONS_FEED_INTERVAL_SECONDS: ${OPERATIONS_FEED_INTERVAL_SECONDS:-15}
      OPERATIONS_FEED_USER_UUID: ${OPERATIONS_FEED_USER_UUID:-${SEED_USER_UUID:-}}
      TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-true}
      TELEMETRY_OPERATIONAL_RETENTION_DAYS: ${TELEMETRY_OPERATIONAL_RETENTION_DAYS:-7}
      TELEMETRY_SECURITY_RETENTION_DAYS: ${TELEMETRY_SECURITY_RETENTION_DAYS:-7}
    depends_on:
      postgres: {condition: service_healthy}
    # This image bakes a HEALTHCHECK against :8000, which this command never binds.
    healthcheck: {disable: true}
    command: [".venv/bin/python", "-m", "scripts.operations_feed"]

  # Durable reporting queue consumer, worker heartbeat, and Dallas scheduler.
  reporting-worker:
    build: {context: ., dockerfile: docker/central-api.Dockerfile}
    restart: on-failure
    stop_grace_period: 15m
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-trackflow}:${POSTGRES_PASSWORD:-trackflow_local_only}@postgres:5432/${POSTGRES_DB:-trackflow_inventory}
      HOME: /tmp/trackflow
      DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-10}
      DATABASE_STATEMENT_TIMEOUT_MS: ${DATABASE_STATEMENT_TIMEOUT_MS:-15000}
      REPORTING_HEARTBEAT_SECONDS: ${REPORTING_HEARTBEAT_SECONDS:-60}
      REPORTING_RUN_TIMEOUT_SECONDS: ${REPORTING_RUN_TIMEOUT_SECONDS:-1800}
      REPORTING_STAGE_TIMEOUT_EXTRACT_SECONDS: ${REPORTING_STAGE_TIMEOUT_EXTRACT_SECONDS:-300}
      REPORTING_STAGE_TIMEOUT_TRANSFORM_SECONDS: ${REPORTING_STAGE_TIMEOUT_TRANSFORM_SECONDS:-300}
      REPORTING_STAGE_TIMEOUT_LOAD_SECONDS: ${REPORTING_STAGE_TIMEOUT_LOAD_SECONDS:-300}
      REPORTING_HOURLY_ROLLUPS_ENABLED: ${REPORTING_HOURLY_ROLLUPS_ENABLED:-false}
      REPORTING_ROLLUP_CUTOVER_ENABLED: ${REPORTING_ROLLUP_CUTOVER_ENABLED:-false}
      REPORTING_COMPUTATION_ENABLED: ${REPORTING_COMPUTATION_ENABLED:-true}
      REPORTING_EXECUTOR: ${REPORTING_EXECUTOR:-direct_sql}
      REPORTING_LOG_PATH: /var/log/trackflow/reporting/reporting-worker.log
      REPORTING_LOG_MAX_BYTES: "10485760"
      REPORTING_LOG_BACKUP_COUNT: "9"
      DO_NOT_TRACK: "1"
    depends_on:
      postgres: {condition: service_healthy}
    read_only: true
    tmpfs: ["/tmp"]
    volumes:
      - reporting-logs:/var/log/trackflow/reporting
    # This image bakes a HEALTHCHECK against :8000, which this command never binds.
    healthcheck: {disable: true}
    command:
      [
        "/bin/sh",
        "-c",
        "mkdir -p /tmp/trackflow && exec .venv/bin/python -m pipelines.business_performance.worker",
      ]
    deploy:
      replicas: 1
      resources:
        limits: {cpus: "0.50", memory: 768M}

  # Database guardrail and 02:15 America/Chicago retention scheduler.
  maintenance-worker:
    build: {context: ., dockerfile: docker/central-api.Dockerfile}
    restart: on-failure
    stop_grace_period: 5m
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-trackflow}:${POSTGRES_PASSWORD:-trackflow_local_only}@postgres:5432/${POSTGRES_DB:-trackflow_inventory}
      MOVEMENT_RETENTION_DAYS: ${MOVEMENT_RETENTION_DAYS:-30}
      OPERATIONS_FEED_USER_UUID: ${OPERATIONS_FEED_USER_UUID:-${SEED_USER_UUID:-}}
      OPERATIONS_FEED_BACKFILL_DAYS: ${OPERATIONS_FEED_BACKFILL_DAYS:-10}
      DB_SIZE_SOFT_LIMIT_MB: ${DB_SIZE_SOFT_LIMIT_MB:-400}
      DB_SIZE_HARD_LIMIT_MB: ${DB_SIZE_HARD_LIMIT_MB:-450}
      TELEMETRY_OPERATIONAL_RETENTION_DAYS: ${TELEMETRY_OPERATIONAL_RETENTION_DAYS:-7}
      TELEMETRY_SECURITY_RETENTION_DAYS: ${TELEMETRY_SECURITY_RETENTION_DAYS:-7}
      HOME: /tmp/trackflow
      REPORTING_LOG_PATH: /var/log/trackflow/reporting/reporting-worker.log
      REPORTING_LOG_RETENTION_DAYS: "14"
      REPORTING_LOG_TOTAL_BYTES: "262144000"
      DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-10}
      DATABASE_STATEMENT_TIMEOUT_MS: ${DATABASE_STATEMENT_TIMEOUT_MS:-15000}
      DO_NOT_TRACK: "1"
    depends_on:
      postgres: {condition: service_healthy}
    read_only: true
    tmpfs: ["/tmp"]
    volumes:
      - reporting-logs:/var/log/trackflow/reporting
    # This image bakes a HEALTHCHECK against :8000, which this command never binds.
    healthcheck: {disable: true}
    command:
      [
        "/bin/sh",
        "-c",
        "mkdir -p /tmp/trackflow && exec .venv/bin/python -m scripts.maintenance_worker",
      ]
    deploy:
      replicas: 1
      resources:
        limits: {cpus: "0.25", memory: 384M}

volumes:
  identity-data:
  reporting-logs:
  qdrant-storage:
