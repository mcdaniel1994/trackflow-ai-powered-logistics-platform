[project]
name = "trackflow-mcp"
version = "0.1.0"
description = "OAuth-protected Streamable HTTP tools for TrackFlow agents."
license = { text = "Proprietary" }
requires-python = ">=3.11"
dependencies = [
    "fastmcp==3.4.5",
    "httpx>=0.28.1",
    "mcpauth==0.2.0b1",
    "pydantic-settings>=2.10.1",
    "pyjwt[crypto]>=2.10.1",
    "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.16.0",
  "pytest>=8.2.0",
  "pytest-asyncio>=0.26.0",
  "pytest-cov>=6.2.0",
  "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trackflow_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"

[[tool.mypy.overrides]]
module = ["mcpauth", "mcpauth.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
